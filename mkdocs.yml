site_name: Microsoft Foundry Tutorials
site_author: Yingding Wang
site_description: Step-by-step tutorials for Microsoft Foundry and Azure Machine Learning.
site_url: https://yingding.github.io/ai-foundry-workshop/
repo_name: ai-foundry-workshop
repo_url: https://github.com/yingding/ai-foundry-workshop
edit_uri: edit/main/
copyright: Copyright &copy; 2026 Yingding Wang

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: amber
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - 05-batch-embedding/assets/stylesheets/diagram-zoom.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - 05-batch-embedding/assets/javascripts/mermaid-init.js
  - 05-batch-embedding/assets/javascripts/diagram-zoom.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - 1. Batch Embeddings:
    - 01 Problem and Architecture: 05-batch-embedding/index.md
    - 02 Quick Start: 05-batch-embedding/02-quick-start.md
    - 03 RPM and Packing Experiment: 05-batch-embedding/03-rpm-packing-experiment.md
    - 04 TPM and APIM Pooling Experiment: 05-batch-embedding/04-tpm-apim-pooling-experiment.md
    - 05 Evidence and Operations: 05-batch-embedding/05-evidence-and-operations.md
